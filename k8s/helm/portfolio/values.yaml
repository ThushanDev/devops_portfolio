replicaCount: 2
image:
  repository: ghcr.io/thushandev/devops_portfolio
  tag: local
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
nameOverride: ""
fullnameOverride: ""
service:
  type: ClusterIP
  port: 80
containerPort: 3000
ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: devops.example.com
  tls:
    enabled: false
    secretName: portfolio-tls
resources:
  requests: { cpu: 100m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
podDisruptionBudget:
  enabled: true
  minAvailable: 1
serviceMonitor:
  enabled: false
  interval: 30s
