name: terraform-plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: tf-plan
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Prepare temporary variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          AVAILABILITY_ZONE_ID: ${{ vars.AVAILABILITY_ZONE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          umask 077
          cat > backend.hcl <<EOF
          bucket = "$TF_STATE_BUCKET"
          key = "devops-portfolio/terraform.tfstate"
          region = "$AWS_REGION"
          dynamodb_table = "$TF_LOCK_TABLE"
          encrypt = true
          EOF
          cat > terraform.tfvars <<EOF
          aws_region = "$AWS_REGION"
          availability_zone_id = "$AVAILABILITY_ZONE_ID"
          terraform_state_bucket = "$TF_STATE_BUCKET"
          terraform_lock_table = "$TF_LOCK_TABLE"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=2m -no-color

# This workflow only plans. No apply/destroy jobs are defined.
