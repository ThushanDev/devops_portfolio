name: portfolio-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test -- --coverage
        working-directory: app
      - name: Start portfolio for browser checks
        working-directory: app
        run: npm start > "$RUNNER_TEMP/portfolio.log" 2>&1 &
      - name: Wait for portfolio
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/portfolio.log"
          exit 1
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:3000
          uploadArtifacts: false
          temporaryPublicStorage: false
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md app/public/index.html docs/**/*.md
          fail: true
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: test
          push: false
          tags: devops-portfolio:test

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          load: true
          target: runtime
          tags: devops_portfolio:release-candidate
          build-args: |
            APP_VERSION=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops_portfolio:release-candidate
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: app/Dockerfile
          push: true
          target: runtime
          tags: ghcr.io/thushandev/devops_portfolio:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
      - uses: anchore/sbom-action@v0.18.0
        with:
          image: ghcr.io/thushandev/devops_portfolio:${{ github.sha }}
          artifact-name: portfolio-sbom.spdx.json
          output-file: portfolio-sbom.spdx.json
      - uses: sigstore/cosign-installer@v3.8.1
      - name: Sign image with keyless OIDC
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: cosign sign --yes ghcr.io/thushandev/devops_portfolio@${{ steps.build.outputs.digest }}

# Deployment is intentionally separate after AWS, kubeconfig, and DNS inputs are reviewed.
